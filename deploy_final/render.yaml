# render.yaml — deploy RPL2 FoodOrder ke Render.com (free tier)
# Buka https://dashboard.render.com/blueprints lalu "New +" → "Blueprint"
# (atau push ke repo yang terhubung; Render membaca file ini otomatis).

services:
  - type: web
    name: rpl2-foodorder
    runtime: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm ci && npm run build
      php artisan key:generate
      php artisan storage:link
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: "RPL2 FoodOrder"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://rpl2-foodorder.onrender.com
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false   # isi manual di dashboard setelah buat cluster TiDB
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
    disk:
      name: storage
      mountPath: /var/data
      sizeGB: 1
