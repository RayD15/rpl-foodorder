  <path d="M130 140 L150 250 Q200 265 250 250 L270 140 Z" fill="#F1F5F9"/>
  <path d="M130 140 L150 250 Q200 265 250 250 L270 140 Z" fill="none" stroke="#CBD5E1" stroke-width="3"/>
  <!-- matcha layer -->
  <path d="M138 165 L154 245 Q200 258 246 245 L262 165 Z" fill="#6B9E3B"/>
  <path d="M138 165 L154 245 Q200 258 246 245 L262 165 Z" fill="none" stroke="#557D2C" stroke-width="2" opacity="0.5"/>
  <!-- milk top -->
  <ellipse cx="200" cy="158" rx="66" ry="18" fill="#FFF8E1"/>
  <!-- handle -->
  <path d="M270 175 Q320 180 318 220 Q316 250 270 240" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>
  <!-- steam -->
