      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFD9A0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- plate -->
  <ellipse cx="200" cy="235" rx="120" ry="28" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="200" cy="233" rx="100" ry="20" fill="#FDE68A"/>
